<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #5a1c14 0%, #3a0f0c 45%, #260a09 100%);
    color: #fff7e6;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  .lantern { position: fixed; top: -8px; z-index: 1; pointer-events: none; }
  .lantern.l1 { left: 4vw; }
  .lantern.l2 { right: 4vw; }
  .lantern .string { width: 2px; height: 56px; background: #b98a4a; margin: 0 auto; }
  .lantern .body {
    width: 54px; height: 68px; border-radius: 46%;
    background: radial-gradient(circle at 38% 32%, #ff7a5c, #d7263d 62%, #9c1425);
    box-shadow: 0 0 26px 4px rgba(255, 90, 60, .35);
    position: relative; animation: sway 4.2s ease-in-out infinite; transform-origin: top center;
  }
  .lantern.l2 .body { animation-delay: -2.1s; }
  .lantern .body::before, .lantern .body::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: 26px; height: 8px; background: #f6c453; border-radius: 3px;
  }
  .lantern .body::before { top: -4px; }
  .lantern .body::after { bottom: -4px; }
  .lantern .tassel {
    width: 3px; height: 22px; background: #f6c453; margin: 0 auto;
    box-shadow: 6px 6px 0 -0.5px #f6c453, -6px 6px 0 -0.5px #f6c453;
  }
  @keyframes sway { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
  @media (max-width: 640px) { .lantern { display: none; } }

  header { text-align: center; padding: 44px 16px 8px; z-index: 2; }
  h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", serif;
    font-size: clamp(30px, 6vw, 46px); letter-spacing: 4px;
    background: linear-gradient(180deg, #ffe9b0 15%, #f6c453 55%, #e09b2d 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.45));
  }
  .sub { margin-top: 12px; font-size: 15px; color: #f3cfa0; opacity: .85; letter-spacing: 2px; }

  .cards {
    display: flex; gap: clamp(16px, 4vw, 36px);
    flex-wrap: wrap; justify-content: center;
    margin: 42px 16px 20px; z-index: 2;
  }
  .card {
    width: min(42vw, 300px);
    border-radius: 24px; overflow: hidden; cursor: pointer;
    text-decoration: none; color: inherit;
    border: 1.5px solid rgba(255, 213, 74, .35);
    background: linear-gradient(180deg, rgba(255, 233, 176, .08), rgba(255, 233, 176, .02));
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    display: flex; flex-direction: column;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 213, 74, .8);
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
  }
  @media (max-width: 560px) { .card { width: min(84vw, 300px); } }
  .card .art {
    height: clamp(140px, 24vw, 190px);
    display: flex; align-items: center; justify-content: center;
  }
  .card .art svg { width: min(34vw, 150px); height: auto; filter: drop-shadow(0 6px 12px rgba(0,0,0,.35)); }
  .card.cook { background: linear-gradient(180deg, rgba(143, 212, 122, .09), rgba(143, 212, 122, .02)); border-color: rgba(143, 212, 122, .35); }
  .card.cook:hover { border-color: rgba(143, 212, 122, .8); }
  .card .label {
    text-align: center; padding: 14px 12px 6px;
    font-size: 25px; font-weight: 800; letter-spacing: 3px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", serif;
  }
  .card.go-out .label { color: #ffd54a; }
  .card.cook .label { color: #a9e29a; }
  .card .desc {
    text-align: center; padding: 0 16px 20px;
    font-size: 13.5px; color: #d8b58a; line-height: 1.7;
  }
  .card .desc b { color: #ffe4b0; font-weight: 600; }
  .card .go {
    margin: 0 auto 18px; padding: 9px 26px; border-radius: 999px;
    font-size: 14px; letter-spacing: 2px; font-weight: 700;
  }
  .card.go-out .go { background: linear-gradient(180deg, #e4372e, #b81f26); color: #ffe9b0; }
  .card.cook .go { background: linear-gradient(180deg, #4f9e3d, #2f6e24); color: #eafff0; }

  footer { margin: 30px 0 34px; font-size: 12px; color: #8f6f4e; letter-spacing: 1px; text-align: center; z-index: 2; }
</style>
</head>
