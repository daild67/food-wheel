<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>今日吃啥 · 美食大转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #5a1c14 0%, #3a0f0c 45%, #260a09 100%);
    color: #fff7e6;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* ---------- 灯笼装饰 ---------- */
  .lantern { position: fixed; top: -8px; z-index: 1; pointer-events: none; }
  .lantern.l1 { left: 4vw; }
  .lantern.l2 { right: 4vw; }
  .lantern .string { width: 2px; height: 56px; background: #b98a4a; margin: 0 auto; }
  .lantern .body {
    width: 54px; height: 68px; border-radius: 46%;
    background: radial-gradient(circle at 38% 32%, #ff7a5c, #d7263d 62%, #9c1425);
    box-shadow: 0 0 26px 4px rgba(255, 90, 60, .35);
    position: relative;
    animation: sway 4.2s ease-in-out infinite;
    transform-origin: top center;
  }
  .lantern.l2 .body { animation-delay: -2.1s; }
  .lantern .body::before, .lantern .body::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: 26px; height: 8px; background: #f6c453; border-radius: 3px;
  }
  .lantern .body::before { top: -4px; }
  .lantern .body::after { bottom: -4px; }
  .lantern .tassel {
    width: 3px; height: 22px; background: #f6c453; margin: 0 auto;
    box-shadow: 6px 6px 0 -0.5px #f6c453, -6px 6px 0 -0.5px #f6c453;
  }
  @keyframes sway { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
  @media (max-width: 640px) { .lantern { display: none; } }

  /* ---------- 头部 ---------- */
  header { text-align: center; padding: 30px 16px 6px; z-index: 2; }
  h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", serif;
    font-size: clamp(30px, 6vw, 46px);
    letter-spacing: 4px;
    background: linear-gradient(180deg, #ffe9b0 15%, #f6c453 55%, #e09b2d 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.45));
  }
  .sub { margin-top: 10px; font-size: 14px; color: #f3cfa0; opacity: .85; letter-spacing: 1px; }
  .sub b { color: #ffd98a; font-weight: 600; }

  /* ---------- 转盘 ---------- */
  .wheel-zone { position: relative; margin-top: 18px; z-index: 2; }
  .wheel-wrap {
    position: relative;
    width: min(88vw, 500px);
    aspect-ratio: 1 / 1;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.5));
  }
  #wheel { width: 100%; height: 100%; display: block; cursor: pointer; will-change: transform; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 5;
    border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-top: 34px solid #ffd54a;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.45));
  }
  .pointer::after {
    content: ""; position: absolute; top: -34px; left: -11px;
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #f0a92d);
    border: 2px solid #a8641a;
  }
  #goBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 27%; aspect-ratio: 1 / 1; border-radius: 50%;
    border: 5px solid #ffe08a;
    background: radial-gradient(circle at 36% 30%, #ff6b52, #d7263d 60%, #9c1425);
    color: #fff7e0; cursor: pointer; z-index: 4;
    font-size: clamp(20px, 5.4vw, 32px); font-weight: 700; letter-spacing: 2px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    box-shadow: 0 8px 22px rgba(0,0,0,.5), inset 0 -6px 14px rgba(0,0,0,.28);
    transition: transform .12s ease;
  }
  #goBtn:active { transform: translate(-50%, -50%) scale(.92); }
  #goBtn:hover { filter: brightness(1.08); }

  .tips { margin-top: 16px; font-size: 13px; color: #d8b58a; letter-spacing: 1px; z-index: 2; }

  /* ---------- 声音按钮 ---------- */
  .sound-btn {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1.5px solid rgba(255, 220, 150, .45);
    background: rgba(60, 16, 12, .55); backdrop-filter: blur(4px);
    color: #ffd54a; font-size: 19px; cursor: pointer; line-height: 1;
  }
  .sound-btn:hover { background: rgba(90, 28, 20, .7); }

  /* ---------- 历史 ---------- */
  .history { width: min(92vw, 640px); margin: 26px auto 10px; z-index: 2; }
  .history h3 {
    font-size: 14px; color: #e8bd85; letter-spacing: 2px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .history h3::before, .history h3::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,189,133,.45), transparent);
  }
  .history .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; min-height: 30px; }
  .history .chip {
    padding: 5px 13px; border-radius: 999px; font-size: 13px;
    background: rgba(255, 220, 150, .1); border: 1px solid rgba(255, 220, 150, .28);
    color: #ffe4b0; animation: pop .25s ease;
  }
  .history .chip:first-child { background: rgba(255, 213, 74, .22); border-color: rgba(255, 213, 74, .55); color: #ffe9b0; }
  .history .empty { color: #a8875f; font-size: 13px; margin-top: 12px; text-align: center; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }

  footer { margin: 26px 0 30px; font-size: 12px; color: #8f6f4e; letter-spacing: 1px; z-index: 2; text-align: center; line-height: 1.9; }

  /* ---------- 结果弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(20, 6, 4, .66); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 18px;
  }
  .modal-mask.show { display: flex; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .modal {
    width: min(94vw, 420px); border-radius: 22px; overflow: hidden;
    background: linear-gradient(180deg, #fff8ea, #ffeed2);
    color: #4a2412; text-align: center;
    animation: zoomin .38s cubic-bezier(.2, 1.4, .4, 1);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    position: relative;
  }
  @keyframes zoomin { from { transform: scale(.6); opacity: 0; } }
  .modal .ribbon {
    background: linear-gradient(180deg, #e4372e, #b81f26);
    color: #ffe9b0; padding: 13px 10px;
    font-size: 17px; letter-spacing: 6px; font-weight: 700;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
  }
  .modal .art { padding: 18px 12px 4px; }
  .modal .art svg { width: min(72vw, 250px); height: auto; filter: drop-shadow(0 6px 10px rgba(90, 40, 10, .18)); }
  .modal .dish {
    font-size: 30px; font-weight: 800; color: #b81f26; margin-top: 8px; letter-spacing: 2px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", serif;
  }
  .modal .brands { padding: 12px 18px 4px; }
  .modal .brands .label { font-size: 12.5px; color: #9a6b3a; letter-spacing: 2px; margin-bottom: 9px; }
  .modal .brand-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .brand-chip {
    padding: 6px 14px; border-radius: 999px; font-size: 14px;
    background: #fff; border: 1.5px solid #e8c48f; color: #7a4a1d; font-weight: 600;
  }
  .brand-chip.pick {
    background: linear-gradient(180deg, #ffd54a, #f0a92d); border-color: #d18a1f;
    color: #5c3000; box-shadow: 0 3px 10px rgba(216, 138, 30, .4);
  }
  .brand-chip.pick::before { content: "今日去吃 "; font-size: 11px; font-weight: 400; opacity: .75; }
  .modal .acts { display: flex; gap: 12px; padding: 20px 22px 24px; }
  .modal .acts button {
    flex: 1; padding: 13px 0; border-radius: 999px; font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 3px; transition: transform .12s ease, filter .12s ease;
    border: none;
  }
  .modal .acts button:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn-again { background: #fff; color: #b81f26; border: 2px solid #e4372e !important; }
  .btn-ok { background: linear-gradient(180deg, #e4372e, #b81f26); color: #ffe9b0; }

  /* ---------- 彩带 ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
</style>
</head>
<body>

<div class="lantern l1"><div class="string"></div><div class="body"></div><div class="tassel"></div></div>
<div class="lantern l2"><div class="string"></div><div class="body"></div><div class="tassel"></div></div>
<button class="sound-btn" id="soundBtn" title="声音开关">🔔</button>

<header>
  <h1>今日吃啥 · 美食大转盘</h1>
  <div class="sub"><b>40</b> 道正经饭菜 · 一键开转 · 选择困难症终结者</div>
</header>

<div class="wheel-zone">
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <button id="goBtn">开吃</button>
  </div>
</div>
<div class="tips">点转盘、按中间「开吃」或敲空格键即可开转</div>

<div class="history">
  <h3>最近吃过</h3>
  <div class="chips" id="histChips"></div>
  <div class="empty" id="histEmpty">还没有记录，转一次试试手气～</div>
</div>

<footer>纯前端页面 · 无需联网加载任何资源 · 每次结果完全随机</footer>

<!-- 结果弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="ribbon">✦ 今 日 份 好 饭 ✦</div>
    <div class="art" id="modalArt"></div>
    <div class="dish" id="modalDish"></div>
    <div class="brands">
      <div class="label">市 面 常 见 品 牌</div>
      <div class="brand-row" id="brandRow"></div>
    </div>
    <div class="acts">
      <button class="btn-again" id="btnAgain">再转一次</button>
      <button class="btn-ok" id="btnOk">就吃这个！</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
"use strict";
/* ==================== 食物插画（纯 SVG 手绘，无外部图片） ==================== */
const SVG_NS = 'xmlns="http://www.w3.org/2000/svg"';
const wrap = inner => `<svg ${SVG_NS} viewBox="0 0 220 160">${inner}</svg>`;
const shadow = (cx=110, cy=142, rx=80) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="9" fill="rgba(60,25,5,.16)"/>`;
const steam = (x=110) => `
  <path d="M${x-30} 34 q7 -9 0 -18" stroke="rgba(120,70,30,.28)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M${x} 28 q-7 -10 0 -20" stroke="rgba(120,70,30,.28)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M${x+30} 34 q7 -9 0 -18" stroke="rgba(120,70,30,.28)" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;

/* 汤面 / 米粉 / 馄饨 / 冒菜 通用汤碗 */
function soupBowl(o) {
  const { bowl='#e8e2d5', bowl2='#f7f3ea', broth='#c8481f', noodle='#f2d98b',
          noodleW=3.2, tops='' } = o;
  return wrap(shadow() + steam() + `
    <path d="M30 78 Q30 140 110 140 Q190 140 190 78 Z" fill="${bowl}"/>
    <path d="M46 92 Q52 126 110 128 Q168 126 174 92 Q140 104 110 104 Q80 104 46 92Z" fill="rgba(0,0,0,.08)"/>
    <ellipse cx="110" cy="78" rx="80" ry="17" fill="${bowl2}"/>
    <ellipse cx="110" cy="78" rx="69" ry="13" fill="${broth}"/>
    <path d="M58 77 q9 -8 18 0 t18 0 t18 0 t18 0 t18 0" stroke="${noodle}" stroke-width="${noodleW}" fill="none" stroke-linecap="round"/>
    <path d="M52 72 q9 -8 18 0 t18 0 t18 0 t18 0 t18 0" stroke="${noodle}" stroke-width="${noodleW}" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M62 83 q9 -8 18 0 t18 0 t18 0 t18 0" stroke="${noodle}" stroke-width="${noodleW}" fill="none" stroke-linecap="round" opacity=".7"/>
    ${tops}
    <ellipse cx="110" cy="78" rx="69" ry="13" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`);
}
const scallion = (x,y) => `<circle cx="${x}" cy="${y}" r="3.4" fill="#5da24a"/><circle cx="${x}" cy="${y}" r="1.4" fill="#8fd47a"/>`;
const chiliOil = (x,y) => `<ellipse cx="${x}" cy="${y}" rx="6" ry="3.6" fill="#e53935" opacity=".9"/><circle cx="${x+3}" cy="${y-2}" r="1.6" fill="#ff8a65"/>`;
const beefSlice = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})"><rect x="${x-11}" y="${y-7}" width="22" height="14" rx="6" fill="#a5583a"/><rect x="${x-8}" y="${y-5}" width="16" height="5" rx="2.5" fill="#c47a52"/></g>`;
const eggHalf = (x,y) => `<circle cx="${x}" cy="${y}" r="10" fill="#fffdf5"/><path d="M${x-10} ${y} a10 10 0 0 0 20 0Z" fill="#ffc445"/><circle cx="${x}" cy="${y+3}" r="3.4" fill="#ff9d2e"/>`;
const tofuPuff = (x,y) => `<rect x="${x-8}" y="${y-6}" width="16" height="12" rx="3.5" fill="#e2a23c"/><rect x="${x-5}" y="${y-3.4}" width="10" height="4" rx="2" fill="#f4c96b"/>`;
const greensDrop = (x,y) => `<path d="M${x} ${y} q-7 -6 -3 -12 q6 2 3 12Z" fill="#4f9e3d"/><path d="M${x} ${y} q7 -6 3 -12 q-6 2 -3 12Z" fill="#61b84c"/>`;
const wontonPouch = (x,y) => `<path d="M${x-11} ${y} q4 -12 11 -3 q7 -9 11 3 q-5 9 -11 9 q-6 0 -11 -9Z" fill="#fbeed6" stroke="#e3cba1" stroke-width="1.5"/>`;
const fishSlice = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})"><rect x="${x-12}" y="${y-6}" width="24" height="12" rx="6" fill="#f4e3d0"/><path d="M${x-9} ${y-3} h18" stroke="#e8b98f" stroke-width="2.4" stroke-linecap="round"/></g>`;

/* 盖浇饭 / 拌饭 通用饭碗 */
function riceBowl(o) {
  const { bowl='#d75a33', bowl2='#e8754e', riceTop='#fff6e8', tops='' } = o;
  return wrap(shadow() + `
    <path d="M30 84 Q30 140 110 140 Q190 140 190 84 Z" fill="${bowl}"/>
    <path d="M46 96 Q54 128 110 130 Q166 128 174 96 Q140 108 110 108 Q80 108 46 96Z" fill="rgba(0,0,0,.1)"/>
    <ellipse cx="110" cy="84" rx="80" ry="17" fill="${bowl2}"/>
    <path d="M45 84 Q68 46 110 46 Q152 46 175 84 Q110 96 45 84Z" fill="${riceTop}"/>
    <path d="M70 62 q12 -7 24 -1 M112 52 q12 -4 22 4 M88 74 q12 -5 24 -1 M126 72 q10 -3 18 4" stroke="#efe0c8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${tops}
    <ellipse cx="110" cy="84" rx="80" ry="17" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2"/>`);
}
const meatLump = (x,y,c='#a05a2c',c2='#c07b45',r=8) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x-2}" cy="${y-2}" r="${r*0.45}" fill="${c2}"/>`;
const pepperBit = (x,y,c='#3f9e3f') => `<rect x="${x-6}" y="${y-2.4}" width="12" height="4.8" rx="2.4" fill="${c}"/>`;

/* 铜锅涮肉 */
function copperPot() {
  return wrap(shadow() + `
    <rect x="104" y="26" width="12" height="34" rx="5" fill="#e0992d"/>
    <circle cx="110" cy="24" r="9" fill="#f2b93e"/><circle cx="110" cy="24" r="4" fill="#c97f1d"/>
    <path d="M34 76 Q30 132 110 138 Q190 132 186 76 Q150 90 110 90 Q70 90 34 76Z" fill="#d98324"/>
    <path d="M34 76 Q70 90 110 90 Q150 90 186 76 L182 62 Q110 76 38 62 Z" fill="#eda43b"/>
    <ellipse cx="110" cy="62" rx="72" ry="15" fill="#f6c453"/>
    <ellipse cx="110" cy="62" rx="52" ry="10" fill="#e9dfc8"/>
    <ellipse cx="110" cy="62" rx="52" ry="10" fill="none" stroke="#c9a86b" stroke-width="2"/>
    <path d="M48 84 Q110 100 172 84" stroke="#b96f1d" stroke-width="3" fill="none" opacity=".5"/>
    ${greensDrop(80,62)}${beefSlice(122,58,-14)}${scallion(140,66)}${greensDrop(102,58)}
    <path d="M52 110 h-14 M168 110 h14" stroke="#eda43b" stroke-width="5" stroke-linecap="round"/>`);
}

/* 火锅（可鸳鸯） */
function hotPot(split) {
  const soup2 = split ? `<path d="M110 30.5 a62 11.5 0 0 1 0 23Z" fill="#f3e6c8"/><path d="M110 31 q7 11 0 23" stroke="#e8d8b5" stroke-width="2" fill="none"/>` : '';
  return wrap(shadow() + steam() + `
    <rect x="36" y="88" width="148" height="10" rx="5" fill="#3a3a42"/>
    <path d="M32 54 Q32 102 110 104 Q188 102 188 54 Q160 68 110 68 Q60 68 32 54Z" fill="#46464f"/>
    <path d="M32 54 Q60 68 110 68 Q160 68 188 54 L184 42 Q110 56 36 42 Z" fill="#55555f"/>
    <ellipse cx="110" cy="42" rx="74" ry="15" fill="#6a6a75"/>
    <ellipse cx="110" cy="42" rx="62" ry="11.5" fill="#c8481f"/>
    ${soup2}
    <ellipse cx="110" cy="42" rx="62" ry="11.5" fill="none" stroke="#e8902e" stroke-width="2.4"/>
    ${meatLump(78,40,'#b5654a','#d4836a',6.5)}${meatLump(140,44,'#8db860','#a8d17a',6.5)}
    ${greensDrop(94,46)}${tofuPuff(126,38)}${scallion(110,40)}${chiliOil(90,34)}
    <path d="M28 58 q-8 6 0 12 M192 58 q8 6 0 12" stroke="#6a6a75" stroke-width="5" fill="none" stroke-linecap="round"/>`);
}

/* 麻辣香锅 / 炒菜 盛盘 */
function pilePlate(o) {
  const { plate='#3c4048', plate2='#4c525c', tops='' } = o;
  return wrap(shadow() + steam() + `
    <ellipse cx="110" cy="106" rx="84" ry="26" fill="${plate}"/>
    <ellipse cx="110" cy="102" rx="84" ry="26" fill="${plate2}"/>
    <ellipse cx="110" cy="102" rx="70" ry="20" fill="#31343b"/>
    <path d="M55 100 Q70 62 110 60 Q150 62 165 100 Q110 112 55 100Z" fill="#8a4a26"/>
    ${tops}
    <ellipse cx="110" cy="102" rx="70" ry="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/>`);
}

/* 串串烧烤 */
function skewers() {
  const one = (x, rot, c1, c2) => `
    <g transform="rotate(${rot} ${x} 90)">
      <rect x="${x-2.5}" y="26" width="5" height="104" rx="2.5" fill="#d9b98c"/>
      <rect x="${x-11}" y="38" width="22" height="15" rx="6" fill="${c1}"/>
      <rect x="${x-11}" y="58" width="22" height="15" rx="6" fill="${c2}"/>
      <rect x="${x-11}" y="78" width="22" height="15" rx="6" fill="${c1}"/>
      <circle cx="${x-4}" cy="43" r="1.6" fill="rgba(255,255,255,.4)"/>
      <circle cx="${x+5}" cy="64" r="1.6" fill="rgba(255,255,255,.35)"/>
      <circle cx="${x-2}" cy="83" r="1.6" fill="rgba(255,255,255,.4)"/>
    </g>`;
  return wrap(shadow(110,146,86) + steam() +
    one(72, -9, '#b5651d', '#d07f34') + one(112, 3, '#c06a2a', '#96521b') + one(152, 10, '#b5651d', '#d07f34') +
    `<circle cx="88" cy="52" r="2" fill="#e53935"/><circle cx="126" cy="46" r="2" fill="#e53935"/><circle cx="146" cy="60" r="2" fill="#43a047"/><circle cx="70" cy="66" r="2" fill="#43a047"/>`);
}

/* 铁板烤肉 */
function grillMeat() {
  return wrap(shadow() + steam() + `
    <ellipse cx="110" cy="102" rx="84" ry="26" fill="#2f3238"/>
    <ellipse cx="110" cy="98" rx="84" ry="26" fill="#3d4149"/>
    <path d="M40 96 h140 M52 108 h116" stroke="#22252b" stroke-width="5" stroke-linecap="round"/>
    <rect x="58" y="66" width="46" height="26" rx="10" fill="#b5651d" transform="rotate(-8 81 79)"/>
    <rect x="58" y="66" width="46" height="26" rx="10" fill="none" stroke="#8a4a12" stroke-width="2" transform="rotate(-8 81 79)"/>
    <rect x="112" y="70" width="46" height="26" rx="10" fill="#c06a2a" transform="rotate(7 135 83)"/>
    <rect x="112" y="70" width="46" height="26" rx="10" fill="none" stroke="#8a4a12" stroke-width="2" transform="rotate(7 135 83)"/>
    <path d="M74 62 q10 -12 22 -4 M128 64 q12 -10 22 -2" stroke="#5a2d0e" stroke-width="2.4" fill="none"/>

/* ==================== 转盘绘制 ==================== */
const N = FOODS.length;
const SEG = 360 / N;
const canvas = document.getElementById('wheel');
let rot = 0, spinning = false, soundOn = true;

function drawWheel() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const cx = size / 2, cy = size / 2, R = size / 2 - 4;

  // 外圈金环
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  const rim = ctx.createLinearGradient(0, 0, size, size);
  rim.addColorStop(0, '#ffe9a8'); rim.addColorStop(.5, '#e0a127'); rim.addColorStop(1, '#f6c453');
  ctx.fillStyle = rim;
  ctx.fill();

  // 扇区
  const inner = R * 0.93;
  for (let i = 0; i < N; i++) {
    const a0 = (i * SEG - 90) * Math.PI / 180;
    const a1 = ((i + 1) * SEG - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, inner, a0, a1);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? '#fdeecb' : '#c93540';
    ctx.fill();
  }
  // 文字
  ctx.save();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.max(11, size * 0.036)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  for (let i = 0; i < N; i++) {
    const mid = (i * SEG + SEG / 2 - 90) * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.fillStyle = i % 2 ? '#8c1f28' : '#fff6e0';
    ctx.fillText(FOODS[i].n, inner - 10, 0);
    ctx.restore();
  }
  ctx.restore();

  // 金环灯珠
  const bulbR = (R + inner) / 2;
  for (let i = 0; i < 24; i++) {
    const a = (i * 15 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * bulbR, cy + Math.sin(a) * bulbR, size * 0.008, 0, Math.PI * 2);
    ctx.fillStyle = i % 2 ? '#fff3cf' : '#d98a1d';
    ctx.fill();
  }
  // 中心底衬
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.185, 0, Math.PI * 2);
  ctx.fillStyle = '#7c1622';
  ctx.fill();
  ctx.lineWidth = size * 0.008;
  ctx.strokeStyle = '#f6c453';
  ctx.stroke();
}
drawWheel();
window.addEventListener('resize', drawWheel);

/* ==================== 声音 ==================== */
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tick() {
  if (!soundOn) return;
  try {
    const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 1750;
    g.gain.setValueAtTime(.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .045);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + .05);
  } catch (e) {}
}
function fanfare() {
  if (!soundOn) return;
  try {
    const ctx = ac();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t0 = ctx.currentTime + i * 0.11;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(.14, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.connect(g).connect(ctx.destination);
      o.start(t0); o.stop(t0 + .32);
    });
  } catch (e) {}
}
document.getElementById('soundBtn').addEventListener('click', function () {
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔔' : '🔕';
});

/* ==================== 转动逻辑 ==================== */
function pointerIndex(r) {
  const a = ((-(r % 360)) % 360 + 360) % 360;
  return Math.floor(a / SEG) % N;
}
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('goBtn').style.pointerEvents = 'none';
  const winner = Math.floor(Math.random() * N);
  const jitter = (Math.random() * 0.7 - 0.35) * SEG;
  const targetCenter = winner * SEG + SEG / 2;
  const cur = ((rot % 360) + 360) % 360;
  let delta = ((-(targetCenter + jitter)) - cur) % 360;
  if (delta < 0) delta += 360;
  const finalRot = rot + 360 * (5 + Math.floor(Math.random() * 3)) + delta;
  const duration = 4400 + Math.random() * 1400;
  const startRot = rot, startT = performance.now();
  let lastIdx = pointerIndex(rot);

  function frame(now) {
    const t = Math.min(1, (now - startT) / duration);
    rot = startRot + (finalRot - startRot) * easeOutQuart(t);
    canvas.style.transform = `rotate(${rot}deg)`;
    const idx = pointerIndex(rot);
    if (idx !== lastIdx) { lastIdx = idx; tick(); }
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('goBtn').style.pointerEvents = '';
      showResult(pointerIndex(finalRot));
    }
  }
  requestAnimationFrame(frame);
}
document.getElementById('goBtn').addEventListener('click', spin);
canvas.addEventListener('click', spin);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); spin(); }
});

/* ==================== 结果弹窗 ==================== */
const mask = document.getElementById('modalMask');
function showResult(i) {
  const f = FOODS[i];
  document.getElementById('modalArt').innerHTML = f.img();
  document.getElementById('modalDish').textContent = f.n;
  const row = document.getElementById('brandRow');
  row.innerHTML = '';
  const pick = Math.floor(Math.random() * f.b.length);
  f.b.forEach((b, bi) => {
    const chip = document.createElement('span');
    chip.className = 'brand-chip' + (bi === pick ? ' pick' : '');
    chip.textContent = b;
    row.appendChild(chip);
  });
  mask.classList.add('show');
  fanfare();
  confettiBurst();
  pushHistory(f);
}
function closeResult(again) {
  mask.classList.remove('show');
  if (again) setTimeout(spin, 260);
}
document.getElementById('btnOk').addEventListener('click', () => closeResult(false));
document.getElementById('btnAgain').addEventListener('click', () => closeResult(true));
mask.addEventListener('click', e => { if (e.target === mask) closeResult(false); });

/* ==================== 历史 ==================== */
const HKEY = 'foodwheel-history';
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; }
}
function pushHistory(f) {
  let h = loadHistory();
  h = h.filter(x => x.n !== f.n);
  h.unshift({ n: f.n, e: f.e });
  h = h.slice(0, 12);
  localStorage.setItem(HKEY, JSON.stringify(h));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  const box = document.getElementById('histChips');
  const empty = document.getElementById('histEmpty');
  box.innerHTML = '';
  h.forEach(x => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = x.e + ' ' + x.n;
    box.appendChild(c);
  });
  empty.style.display = h.length ? 'none' : 'block';
}
renderHistory();

/* ==================== 彩带 ==================== */
const cf = document.getElementById('confetti');
const cfx = cf.getContext('2d');
let parts = [], cfRunning = false;
function sizeConfetti() {
  cf.width = innerWidth; cf.height = innerHeight;
}
sizeConfetti();
window.addEventListener('resize', sizeConfetti);
function confettiBurst() {
  const colors = ['#ffd54a', '#e4372e', '#fff3cf', '#f0a92d', '#ff8a65', '#8fd47a'];
  for (let i = 0; i < 130; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 160,
      y: innerHeight * .38,
      vx: (Math.random() - .5) * 13,
      vy: -6 - Math.random() * 9,
      s: 5 + Math.random() * 6,
      c: colors[Math.floor(Math.random() * colors.length)],
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      life: 1
    });
  }
  if (!cfRunning) { cfRunning = true; requestAnimationFrame(cfFrame); }
}
function cfFrame() {
  cfx.clearRect(0, 0, cf.width, cf.height);
  parts.forEach(p => {
    p.vy += .32; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life -= .008;
    cfx.save();
    cfx.translate(p.x, p.y);
    cfx.rotate(p.r);
    cfx.globalAlpha = Math.max(0, p.life);
    cfx.fillStyle = p.c;
    cfx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .62);
    cfx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cf.height + 30);
  if (parts.length) { requestAnimationFrame(cfFrame); }
  else { cfRunning = false; cfx.clearRect(0, 0, cf.width, cf.height); }
}
