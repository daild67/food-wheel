<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>在家做 · 家常菜大转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: radial-gradient(1200px 700px at 50% -10%, #1d3a1d 0%, #17311a 45%, #0f2412 100%);
    color: #fff7e6;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  /* ---------- 灯笼装饰 ---------- */
  .lantern { position: fixed; top: -8px; z-index: 1; pointer-events: none; }
  .lantern.l1 { left: 4vw; }
  .lantern.l2 { right: 4vw; }
  .lantern .string { width: 2px; height: 56px; background: #b98a4a; margin: 0 auto; }
  .lantern .body {
    width: 54px; height: 68px; border-radius: 46%;
    background: radial-gradient(circle at 38% 32%, #ff7a5c, #d7263d 62%, #9c1425);
    box-shadow: 0 0 26px 4px rgba(255, 90, 60, .35);
    position: relative;
    animation: sway 4.2s ease-in-out infinite;
    transform-origin: top center;
  }
  .lantern.l2 .body { animation-delay: -2.1s; }
  .lantern .body::before, .lantern .body::after {
    content: ""; position: absolute; left: 50%; transform: translateX(-50%);
    width: 26px; height: 8px; background: #f6c453; border-radius: 3px;
  }
  .lantern .body::before { top: -4px; }
  .lantern .body::after { bottom: -4px; }
  .lantern .tassel {
    width: 3px; height: 22px; background: #f6c453; margin: 0 auto;
    box-shadow: 6px 6px 0 -0.5px #f6c453, -6px 6px 0 -0.5px #f6c453;
  }
  @keyframes sway { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg); } }
  @media (max-width: 640px) { .lantern { display: none; } }

  /* ---------- 头部 ---------- */
  header { text-align: center; padding: 30px 16px 6px; z-index: 2; }
  h1 {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", serif;
    font-size: clamp(30px, 6vw, 46px);
    letter-spacing: 4px;
    background: linear-gradient(180deg, #e8ffd8 15%, #a9e29a 55%, #6fbf4a 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.45));
  }
  .sub { margin-top: 10px; font-size: 14px; color: #cfe8c0; opacity: .85; letter-spacing: 1px; }
  .sub b { color: #d8f5c8; font-weight: 600; }

  /* ---------- 转盘 ---------- */
  .wheel-zone { position: relative; margin-top: 18px; z-index: 2; }
  .wheel-wrap {
    position: relative;
    width: min(88vw, 500px);
    aspect-ratio: 1 / 1;
    filter: drop-shadow(0 18px 40px rgba(0,0,0,.5));
  }
  #wheel { width: 100%; height: 100%; display: block; cursor: pointer; will-change: transform; }
  .pointer {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; z-index: 5;
    border-left: 17px solid transparent; border-right: 17px solid transparent;
    border-top: 34px solid #ffd54a;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.45));
  }
  .pointer::after {
    content: ""; position: absolute; top: -34px; left: -11px;
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffe9a8, #f0a92d);
    border: 2px solid #a8641a;
  }
  #goBtn {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 27%; aspect-ratio: 1 / 1; border-radius: 50%;
    border: 5px solid #c8f0b0;
    background: radial-gradient(circle at 36% 30%, #7ed162, #3f9e2f 60%, #2a7020);
    color: #f4ffe8; cursor: pointer; z-index: 4;
    font-size: clamp(20px, 5.4vw, 32px); font-weight: 700; letter-spacing: 2px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    box-shadow: 0 8px 22px rgba(0,0,0,.5), inset 0 -6px 14px rgba(0,0,0,.28);
    transition: transform .12s ease;
  }
  #goBtn:active { transform: translate(-50%, -50%) scale(.92); }
  #goBtn:hover { filter: brightness(1.08); }

  .tips { margin-top: 16px; font-size: 13px; color: #a8cc96; letter-spacing: 1px; z-index: 2; }

  /* ---------- 声音 / 返回 ---------- */
  .sound-btn {
    position: fixed; top: 14px; right: 14px; z-index: 20;
    width: 42px; height: 42px; border-radius: 50%;
    border: 1.5px solid rgba(200, 240, 176, .45);
    background: rgba(16, 40, 18, .55); backdrop-filter: blur(4px);
    color: #ffd54a; font-size: 19px; cursor: pointer; line-height: 1;
  }
  .sound-btn:hover { background: rgba(24, 60, 26, .7); }
  .back-btn {
    position: fixed; top: 14px; left: 14px; z-index: 20;
    display: inline-flex; align-items: center; gap: 6px;
    height: 42px; padding: 0 16px; border-radius: 999px;
    border: 1.5px solid rgba(200, 240, 176, .45);
    background: rgba(16, 40, 18, .55); backdrop-filter: blur(4px);
    color: #c8f0b0; font-size: 14px; letter-spacing: 1px; cursor: pointer;
    text-decoration: none; font-family: inherit;
  }
  .back-btn:hover { background: rgba(24, 60, 26, .7); }
  .back-btn .arr { font-size: 16px; }

  /* ---------- 历史 ---------- */
  .history { width: min(92vw, 640px); margin: 26px auto 10px; z-index: 2; }
  .history h3 {
    font-size: 14px; color: #b8d8a4; letter-spacing: 2px; font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .history h3::before, .history h3::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(184,216,164,.45), transparent);
  }
  .history .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; min-height: 30px; }
  .history .chip {
    padding: 5px 13px; border-radius: 999px; font-size: 13px;
    background: rgba(200, 240, 176, .1); border: 1px solid rgba(200, 240, 176, .28);
    color: #dcf5c8; animation: pop .25s ease;
  }
  .history .chip:first-child { background: rgba(169, 226, 154, .22); border-color: rgba(169, 226, 154, .55); color: #e8ffd8; }
  .history .empty { color: #7d9c6b; font-size: 13px; margin-top: 12px; text-align: center; }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } }

  footer { margin: 26px 0 30px; font-size: 12px; color: #6f8f5e; letter-spacing: 1px; z-index: 2; text-align: center; line-height: 1.9; }

  /* ---------- 结果弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8, 20, 8, .66); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; padding: 18px;
  }
  .modal-mask.show { display: flex; animation: fadein .25s ease; }
  @keyframes fadein { from { opacity: 0; } }
  .modal {
    width: min(94vw, 430px); max-height: 88vh; overflow-y: auto;
    border-radius: 22px;
    background: linear-gradient(180deg, #f6fbef, #eaf5de);
    color: #2e4a20; text-align: center;
    animation: zoomin .38s cubic-bezier(.2, 1.4, .4, 1);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
  }
  .modal::-webkit-scrollbar { width: 6px; }
  .modal::-webkit-scrollbar-thumb { background: rgba(110, 160, 90, .4); border-radius: 3px; }
  @keyframes zoomin { from { transform: scale(.6); opacity: 0; } }
  .modal .ribbon {
    background: linear-gradient(180deg, #4f9e3d, #2f6e24);
    color: #eafff0; padding: 13px 10px;
    font-size: 17px; letter-spacing: 6px; font-weight: 700;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    position: sticky; top: 0; z-index: 2;
  }
  .modal .art { padding: 16px 12px 2px; }
  .modal .art svg { width: min(64vw, 220px); height: auto; filter: drop-shadow(0 6px 10px rgba(40, 70, 20, .18)); }
  .modal .dish {
    font-size: 29px; font-weight: 800; color: #2f6e24; margin-top: 6px; letter-spacing: 2px;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "PingFang SC", serif;
  }
  .modal .ingr, .modal .nutr { text-align: left; padding: 10px 20px 2px; }
  .modal .label {
    font-size: 12.5px; color: #5a7d46; letter-spacing: 3px; margin-bottom: 9px; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .modal .label::after { content: ""; flex: 1; height: 1px; background: rgba(90,125,70,.3); }
  .modal .ingr-row { display: flex; flex-wrap: wrap; gap: 7px; }
  .ingr-chip {
    padding: 6px 12px; border-radius: 9px; font-size: 13px;
    background: #fff; border: 1.5px solid #cfe3bd; color: #3c6e2c; font-weight: 600;
  }
  .modal .nutr p {
    font-size: 13.5px; color: #4a5a3c; line-height: 1.85;
    background: rgba(255,255,255,.6); border-radius: 12px;
    padding: 10px 12px; text-align: justify;
  }
  .modal .acts { display: flex; gap: 12px; padding: 18px 22px 22px; position: sticky; bottom: 0; background: linear-gradient(0deg, #eaf5de 60%, rgba(234,245,222,0)); }
  .modal .acts button {
    flex: 1; padding: 13px 0; border-radius: 999px; font-size: 16px; font-weight: 700;
    cursor: pointer; letter-spacing: 3px; transition: transform .12s ease, filter .12s ease;
    border: none;
  }
  .modal .acts button:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn-again { background: #fff; color: #2f6e24; border: 2px solid #4f9e3d !important; }
  .btn-ok { background: linear-gradient(180deg, #4f9e3d, #2f6e24); color: #eafff0; }

  /* ---------- 彩带 ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
</style>
</head>
<body>

<div class="lantern l1"><div class="string"></div><div class="body"></div><div class="tassel"></div></div>
<div class="lantern l2"><div class="string"></div><div class="body"></div><div class="tassel"></div></div>
<button class="sound-btn" id="soundBtn" title="声音开关">🔔</button>
<a class="back-btn" href="../index.html"><span class="arr">←</span> 重新选择</a>

<header>
  <h1>在家做 · 家常菜大转盘</h1>
  <div class="sub"><b>在家做</b> · <b>42</b> 道家常菜 · 附食材清单与营养价值</div>
</header>

<div class="wheel-zone">
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel"></canvas>
    <button id="goBtn">开做</button>
  </div>
</div>
<div class="tips">点转盘、按中间「开做」或敲空格键即可开转</div>

<div class="history">
  <h3>最近做过</h3>
  <div class="chips" id="histChips"></div>
  <div class="empty" id="histEmpty">还没有记录，转一次决定今天做啥菜～</div>
</div>

<footer>纯前端页面 · 无需联网加载任何资源 · 每次结果完全随机</footer>

<!-- 结果弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal">
    <div class="ribbon">✦ 今 日 份 家 常 菜 ✦</div>
    <div class="art" id="modalArt"></div>
    <div class="dish" id="modalDish"></div>
    <div class="ingr">
      <div class="label">食 材 准 备</div>
      <div class="ingr-row" id="ingrRow"></div>
    </div>
    <div class="nutr">
      <div class="label">营 养 价 值</div>
      <p id="nutrText"></p>
    </div>
    <div class="acts">
      <button class="btn-again" id="btnAgain">再转一次</button>
      <button class="btn-ok" id="btnOk">就做这道菜！</button>
    </div>
  </div>
</div>

<canvas id="confetti"></canvas>

<script>
"use strict";
/* ==================== 食物插画（纯 SVG 手绘，无外部图片） ==================== */
const SVG_NS = 'xmlns="http://www.w3.org/2000/svg"';
const wrap = inner => `<svg ${SVG_NS} viewBox="0 0 220 160">${inner}</svg>`;
const shadow = (cx=110, cy=146, rx=80) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="9" fill="rgba(20,40,10,.18)"/>`;
const steam = (x=110) => `
  <path d="M${x-30} 34 q7 -9 0 -18" stroke="rgba(150,200,130,.3)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M${x} 28 q-7 -10 0 -20" stroke="rgba(150,200,130,.3)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
  <path d="M${x+30} 34 q7 -9 0 -18" stroke="rgba(150,200,130,.3)" stroke-width="3.4" fill="none" stroke-linecap="round"/>`;

/* ---------- 器皿 ---------- */
function plateLight(tops, inner='#f4ecd6') {
  return wrap(shadow(110,136,88) + `
    <ellipse cx="110" cy="112" rx="88" ry="26" fill="#ddd0b0"/>
    <ellipse cx="110" cy="105" rx="88" ry="26" fill="#fdf7ea"/>
    <ellipse cx="110" cy="105" rx="72" ry="20" fill="${inner}"/>
    ${tops}
    <ellipse cx="110" cy="105" rx="72" ry="20" fill="none" stroke="rgba(170,130,70,.3)" stroke-width="2"/>`);
}
function plateDark(tops) {
  return wrap(shadow(110,136,88) + steam() + `
    <ellipse cx="110" cy="112" rx="88" ry="26" fill="#2f333a"/>
    <ellipse cx="110" cy="105" rx="88" ry="26" fill="#4c525c"/>
    <ellipse cx="110" cy="105" rx="72" ry="20" fill="#31343b"/>
    ${tops}
    <ellipse cx="110" cy="105" rx="72" ry="20" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="2"/>`);
}
function soupBowlV(o) {
  const { bowl='#e8e2d5', bowl2='#f7f3ea', broth='#c8481f', noodle='', noodleW=3.2, tops='' } = o;
  return wrap(shadow() + steam() + `
    <path d="M30 78 Q30 140 110 140 Q190 140 190 78 Z" fill="${bowl}"/>
    <path d="M46 92 Q52 126 110 128 Q168 126 174 92 Q140 104 110 104 Q80 104 46 92Z" fill="rgba(0,0,0,.08)"/>
    <ellipse cx="110" cy="78" rx="80" ry="17" fill="${bowl2}"/>
    <ellipse cx="110" cy="78" rx="69" ry="13" fill="${broth}"/>
    ${noodle ? `<path d="M58 77 q9 -8 18 0 t18 0 t18 0 t18 0 t18 0" stroke="${noodle}" stroke-width="${noodleW}" fill="none" stroke-linecap="round"/>
    <path d="M52 72 q9 -8 18 0 t18 0 t18 0 t18 0 t18 0" stroke="${noodle}" stroke-width="${noodleW}" fill="none" stroke-linecap="round" opacity=".85"/>
    <path d="M62 83 q9 -8 18 0 t18 0 t18 0 t18 0" stroke="${noodle}" stroke-width="${noodleW}" fill="none" stroke-linecap="round" opacity=".7"/>` : ''}
    ${tops}
    <ellipse cx="110" cy="78" rx="69" ry="13" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`);
}
function riceBowlV(o) {
  const { bowl='#3f6e8a', bowl2='#4d80a0', riceTop='#fff6e8', tops='' } = o;
  return wrap(shadow() + `
    <path d="M30 84 Q30 140 110 140 Q190 140 190 84 Z" fill="${bowl}"/>
    <path d="M46 96 Q54 128 110 130 Q166 128 174 96 Q140 108 110 108 Q80 108 46 96Z" fill="rgba(0,0,0,.1)"/>
    <ellipse cx="110" cy="84" rx="80" ry="17" fill="${bowl2}"/>
    <path d="M45 84 Q68 46 110 46 Q152 46 175 84 Q110 96 45 84Z" fill="${riceTop}"/>
    <path d="M70 62 q12 -7 24 -1 M112 52 q12 -4 22 4 M88 74 q12 -5 24 -1 M126 72 q10 -3 18 4" stroke="#efe0c8" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    ${tops}
    <ellipse cx="110" cy="84" rx="80" ry="17" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="2"/>`);
}

/* ---------- 食材零件 ---------- */
const scallion = (x,y) => `<circle cx="${x}" cy="${y}" r="3.4" fill="#5da24a"/><circle cx="${x}" cy="${y}" r="1.4" fill="#8fd47a"/>`;
const greensDrop = (x,y) => `<path d="M${x} ${y} q-7 -6 -3 -12 q6 2 3 12Z" fill="#4f9e3d"/><path d="M${x} ${y} q7 -6 3 -12 q-6 2 -3 12Z" fill="#61b84c"/>`;
const chiliOil = (x,y) => `<ellipse cx="${x}" cy="${y}" rx="6" ry="3.6" fill="#e53935" opacity=".9"/><circle cx="${x+3}" cy="${y-2}" r="1.6" fill="#ff8a65"/>`;
const meatLump = (x,y,c='#a05a2c',c2='#c07b45',r=8) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/><circle cx="${x-2}" cy="${y-2}" r="${r*0.45}" fill="${c2}"/>`;
const pepperBit = (x,y,c='#3f9e3f') => `<rect x="${x-6}" y="${y-2.4}" width="12" height="4.8" rx="2.4" fill="${c}"/>`;
const beefSlice = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})"><rect x="${x-11}" y="${y-7}" width="22" height="14" rx="6" fill="#a5583a"/><rect x="${x-8}" y="${y-5}" width="16" height="5" rx="2.5" fill="#c47a52"/></g>`;
const fishSlice = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})"><rect x="${x-12}" y="${y-6}" width="24" height="12" rx="6" fill="#f4e3d0"/><path d="M${x-9} ${y-3} h18" stroke="#e8b98f" stroke-width="2.4" stroke-linecap="round"/></g>`;
const shrimp = (x,y) => `<path d="M${x-10} ${y+4} q4 -14 18 -10 q10 3 6 12 q-2 5 -8 4 q4 -8 -4 -10 q-8 -2 -8 8Z" fill="#e8836b"/><path d="M${x-10} ${y+4} l-4 6 l7 -2Z" fill="#e8836b"/>`;
const shrimpBig = (x,y,r=0,c='#e86a4a') => `<g transform="rotate(${r} ${x} ${y})">
  <path d="M${x-22} ${y+2} q0 -18 20 -18 q16 0 16 14 q0 10 -10 12 q-14 3 -26 -8Z" fill="${c}"/>
  <path d="M${x+10} ${y-6} l14 -10 -2 14Z" fill="${c}"/>
  <path d="M${x-22} ${y+2} q8 6 16 6" stroke="rgba(255,255,255,.35)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <circle cx="${x-12}" cy="${y-6}" r="2.4" fill="#3a2418"/></g>`;

const tomatoP = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})">
  <path d="M${x-12} ${y} a12 11 0 0 1 24 0 q-12 9 -24 0Z" fill="#e8442e"/>
  <path d="M${x-4} ${y-9} l4 -6 l4 6Z" fill="#4f9e3d"/></g>`;
const eggP = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})">
  <path d="M${x-13} ${y-6} q13 -9 26 0 q4 12 -13 13 q-17 -1 -13 -13Z" fill="#fff8e8"/>
  <path d="M${x-6} ${y-3} q6 -5 12 0 q2 7 -6 7 q-8 0 -6 -7Z" fill="#ffc445"/></g>`;
const meatC = (x,y,s=11,c='#b0622c',c2='#cf8450',r=0) => `<g transform="rotate(${r} ${x} ${y})">
  <rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="${s*0.55}" fill="${c}"/>
  <rect x="${x-s*0.62}" y="${y-s*0.62}" width="${s*1.24}" height="${s*1.24}" rx="${s*0.35}" fill="${c2}"/></g>`;
const leafBig = (x,y,r=0,c='#4f9e3d',c2='#6ec253') => `<g transform="rotate(${r} ${x} ${y})">
  <path d="M${x} ${y} q-13 -9 -7 -20 q10 2 7 20Z" fill="${c}"/>
  <path d="M${x} ${y} q13 -9 7 -20 q-10 2 -7 20Z" fill="${c2}"/>
  <path d="M${x} ${y} l0 -13" stroke="#3c7d2e" stroke-width="1.6"/></g>`;
const chiliR = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})">
  <rect x="${x-15}" y="${y-3}" width="30" height="6" rx="3" fill="#e0452e"/>
  <path d="M${x-15} ${y} l-6 -4" stroke="#4f9e3d" stroke-width="2.6" stroke-linecap="round"/></g>`;
const peanut = (x,y) => `<ellipse cx="${x}" cy="${y}" rx="5" ry="6.6" fill="#f2dc9f"/><path d="M${x} ${y-4} v8" stroke="#d9bf7a" stroke-width="1.4"/>`;
const tofuC = (x,y,s=9,r=0) => `<g transform="rotate(${r} ${x} ${y})">
  <rect x="${x-s}" y="${y-s}" width="${s*2}" height="${s*2}" rx="2.5" fill="#fdfaf2"/>
  <rect x="${x-s*0.66}" y="${y-s*0.66}" width="${s*1.32}" height="${s*1.32}" rx="2" fill="#f0e9d8"/>
  <path d="M${x-s*0.5} ${y-s*0.5} q${s} ${s*0.2} ${s} ${s*0.8}" stroke="#e2d8bf" stroke-width="1.6" fill="none"/></g>`;
const carrotP = (x,y,r=0) => `<g transform="rotate(${r} ${x} ${y})">
  <rect x="${x-11}" y="${y-3.4}" width="22" height="6.8" rx="3.4" fill="#ef7d2e"/>
  <rect x="${x-7}" y="${y-2}" width="12" height="4" rx="2" fill="#f9a45c"/>

/* ==================== 转盘绘制 ==================== */
const N = FOODS.length;
const SEG = 360 / N;
const canvas = document.getElementById('wheel');
let rot = 0, spinning = false, soundOn = true;

function drawWheel() {
  const dpr = window.devicePixelRatio || 1;
  const size = canvas.clientWidth;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const cx = size / 2, cy = size / 2, R = size / 2 - 4;

  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  const rim = ctx.createLinearGradient(0, 0, size, size);
  rim.addColorStop(0, '#e8ffd8'); rim.addColorStop(.5, '#a9e29a'); rim.addColorStop(1, '#d8f5c8');
  ctx.fillStyle = rim;
  ctx.fill();

  const inner = R * 0.93;
  for (let i = 0; i < N; i++) {
    const a0 = (i * SEG - 90) * Math.PI / 180;
    const a1 = ((i + 1) * SEG - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, inner, a0, a1);
    ctx.closePath();
    ctx.fillStyle = i % 2 ? '#f0f7e6' : '#2f6e24';
    ctx.fill();
  }
  ctx.save();
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = `700 ${Math.max(11, size * 0.036)}px "PingFang SC","Microsoft YaHei",sans-serif`;
  for (let i = 0; i < N; i++) {
    const mid = (i * SEG + SEG / 2 - 90) * Math.PI / 180;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.fillStyle = i % 2 ? '#2f6e24' : '#f4ffe8';
    ctx.fillText(FOODS[i].n, inner - 10, 0);
    ctx.restore();
  }
  ctx.restore();

  const bulbR = (R + inner) / 2;
  for (let i = 0; i < 24; i++) {
    const a = (i * 15 - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a) * bulbR, cy + Math.sin(a) * bulbR, size * 0.008, 0, Math.PI * 2);
    ctx.fillStyle = i % 2 ? '#ffffff' : '#8fd47a';
    ctx.fill();
  }
  ctx.beginPath();
  ctx.arc(cx, cy, size * 0.185, 0, Math.PI * 2);
  ctx.fillStyle = '#245318';
  ctx.fill();
  ctx.lineWidth = size * 0.008;
  ctx.strokeStyle = '#a9e29a';
  ctx.stroke();
}
drawWheel();
window.addEventListener('resize', drawWheel);

/* ==================== 声音 ==================== */
let audioCtx = null;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function tick() {
  if (!soundOn) return;
  try {
    const ctx = ac(), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square'; o.frequency.value = 1750;
    g.gain.setValueAtTime(.08, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .045);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + .05);
  } catch (e) {}
}
function fanfare() {
  if (!soundOn) return;
  try {
    const ctx = ac();
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const t0 = ctx.currentTime + i * 0.11;
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(.14, t0 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + .3);
      o.connect(g).connect(ctx.destination);
      o.start(t0); o.stop(t0 + .32);
    });
  } catch (e) {}
}
document.getElementById('soundBtn').addEventListener('click', function () {
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔔' : '🔕';
});

/* ==================== 转动逻辑 ==================== */
function pointerIndex(r) {
  const a = ((-(r % 360)) % 360 + 360) % 360;
  return Math.floor(a / SEG) % N;
}
const easeOutQuart = t => 1 - Math.pow(1 - t, 4);

function spin() {
  if (spinning) return;
  spinning = true;
  document.getElementById('goBtn').style.pointerEvents = 'none';
  const winner = Math.floor(Math.random() * N);
  const jitter = (Math.random() * 0.7 - 0.35) * SEG;
  const targetCenter = winner * SEG + SEG / 2;
  const cur = ((rot % 360) + 360) % 360;
  let delta = ((-(targetCenter + jitter)) - cur) % 360;
  if (delta < 0) delta += 360;
  const finalRot = rot + 360 * (5 + Math.floor(Math.random() * 3)) + delta;
  const duration = 4400 + Math.random() * 1400;
  const startRot = rot, startT = performance.now();
  let lastIdx = pointerIndex(rot);

  function frame(now) {
    const t = Math.min(1, (now - startT) / duration);
    rot = startRot + (finalRot - startRot) * easeOutQuart(t);
    canvas.style.transform = `rotate(${rot}deg)`;
    const idx = pointerIndex(rot);
    if (idx !== lastIdx) { lastIdx = idx; tick(); }
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinning = false;
      document.getElementById('goBtn').style.pointerEvents = '';
      showResult(pointerIndex(finalRot));
    }
  }
  requestAnimationFrame(frame);
}
document.getElementById('goBtn').addEventListener('click', spin);
canvas.addEventListener('click', spin);
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); spin(); }
});

/* ==================== 结果弹窗 ==================== */
const mask = document.getElementById('modalMask');
function showResult(i) {
  const f = FOODS[i];
  document.getElementById('modalArt').innerHTML = f.img();
  document.getElementById('modalDish').textContent = f.n;
  const row = document.getElementById('ingrRow');
  row.innerHTML = '';
  f.i.forEach(name => {
    const chip = document.createElement('span');
    chip.className = 'ingr-chip';
    chip.textContent = name;
    row.appendChild(chip);
  });
  document.getElementById('nutrText').textContent = f.t;
  mask.classList.add('show');
  fanfare();
  confettiBurst();
  pushHistory(f);
}
function closeResult(again) {
  mask.classList.remove('show');
  if (again) setTimeout(spin, 260);
}
document.getElementById('btnOk').addEventListener('click', () => closeResult(false));
document.getElementById('btnAgain').addEventListener('click', () => closeResult(true));
mask.addEventListener('click', e => { if (e.target === mask) closeResult(false); });

/* ==================== 历史 ==================== */
const HKEY = 'cookwheel-history';
function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HKEY)) || []; } catch (e) { return []; }
}
function pushHistory(f) {
  let h = loadHistory();
  h = h.filter(x => x.n !== f.n);
  h.unshift({ n: f.n, e: f.e });
  h = h.slice(0, 12);
  localStorage.setItem(HKEY, JSON.stringify(h));
  renderHistory();
}
function renderHistory() {
  const h = loadHistory();
  const box = document.getElementById('histChips');
  const empty = document.getElementById('histEmpty');
  box.innerHTML = '';
  h.forEach(x => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = x.e + ' ' + x.n;
    box.appendChild(c);
  });
  empty.style.display = h.length ? 'none' : 'block';
}
renderHistory();

/* ==================== 彩带 ==================== */
const cf = document.getElementById('confetti');
const cfx = cf.getContext('2d');
let parts = [], cfRunning = false;
function sizeConfetti() {
  cf.width = innerWidth; cf.height = innerHeight;
}
sizeConfetti();
window.addEventListener('resize', sizeConfetti);
function confettiBurst() {
  const colors = ['#a9e29a', '#ffd54a', '#eafff0', '#6fbf4a', '#fff3cf', '#8fd47a'];
  for (let i = 0; i < 130; i++) {
    parts.push({
      x: innerWidth / 2 + (Math.random() - .5) * 160,
      y: innerHeight * .38,
      vx: (Math.random() - .5) * 13,
      vy: -6 - Math.random() * 9,
      s: 5 + Math.random() * 6,
      c: colors[Math.floor(Math.random() * colors.length)],
      r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
      life: 1
    });
  }
  if (!cfRunning) { cfRunning = true; requestAnimationFrame(cfFrame); }
}
function cfFrame() {
  cfx.clearRect(0, 0, cf.width, cf.height);
  parts.forEach(p => {
    p.vy += .32; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life -= .008;
    cfx.save();
    cfx.translate(p.x, p.y);
    cfx.rotate(p.r);
    cfx.globalAlpha = Math.max(0, p.life);
    cfx.fillStyle = p.c;
    cfx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .62);
    cfx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cf.height + 30);
  if (parts.length) { requestAnimationFrame(cfFrame); }
  else { cfRunning = false; cfx.clearRect(0, 0, cf.width, cf.height); }
}
</script>
